name: Make Bilingual Book

on:
  workflow_dispatch:
    inputs:
      book_path:
        description: '电子书文件名'
        required: true
        default: 'test.epub'
      model:
        description: '使用的模型'
        required: true
        default: 'gemini'

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python make_book.py --book_name "${{ github.event.inputs.book_path }}" --model "${{ github.event.inputs.model }}" --language "zh-hans"

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: bilingual-book
          path: "*_bilingual.epub"
